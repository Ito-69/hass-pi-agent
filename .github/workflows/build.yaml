---
name: Build and Publish Add-on

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        description: "Release tag (e.g., v0.9.0)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g., v0.9.0)"
        required: false
        type: string
  pull_request:
    branches:
      - main

env:
  ADDON_SLUG: hass_ai_assistant
  BUILD_CONTEXT: addon
  ARCHITECTURES: '["amd64", "aarch64"]'

jobs:
  init:
    name: Initialize build
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - name: Get version
        id: version
        run: |
          if [[ -n "${{ inputs.tag }}" ]]; then
            echo "version=${{ inputs.tag }}" | sed 's/version=v/version=/' >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(grep '^version:' addon/config.yaml | awk '{print $2}' | tr -d '\"')" >> "$GITHUB_OUTPUT"
          fi

      - name: Get build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.06.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ env.ADDON_SLUG }}

  build:
    name: Build ${{ matrix.arch }} image
    needs: init
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.init.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6

      - name: Sync extension source into addon build context
        run: |
          rm -rf addon/extensions/home-assistant
          mkdir -p addon/extensions
          cp -a .pi/extensions/home-assistant addon/extensions/home-assistant
          rm -rf addon/extensions/home-assistant/node_modules addon/extensions/home-assistant/data

      - name: Build image
        uses: home-assistant/builder/actions/build-image@2026.06.0
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: ${{ env.BUILD_CONTEXT }}
          cosign: false
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.init.outputs.version }}
            ${{ github.event_name != 'pull_request' && 'latest' || '' }}
          push: ${{ github.event_name != 'pull_request' }}
          version: ${{ needs.init.outputs.version }}

  manifest:
    name: Publish multi-arch manifest
    if: github.event_name != 'pull_request'
    needs: [init, build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Publish multi-arch manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.06.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          cosign: false
          image-name: ${{ env.ADDON_SLUG }}
          image-tags: |
            ${{ needs.init.outputs.version }}
            latest
