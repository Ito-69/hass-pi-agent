ask:
  name: Ask HASS AI Assistant
  description: Send a question to the HASS AI Assistant. It will act on it — results appear as state changes and service calls in the logbook (and optionally return responses).
  fields:
    question:
      name: Question
      description: The question or instruction for the AI Assistant.
      required: true
      example: "Turn off all lights in the living room"
      selector:
        text:
          multiline: true
    provider:
      name: Provider
      description: Override the AI provider for this call (uses add-on default if not set).
      selector:
        select:
          options:
            - anthropic
            - openai
            - google
            - openrouter
            - groq
            - xai
            - mistral
            - opencode-zen
            - minimax
            - omniroute
          custom_value: true
    model:
      name: Model
      description: Override the AI model for this call (uses add-on default if not set).
      selector:
        text:
