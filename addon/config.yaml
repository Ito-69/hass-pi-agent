name: HASS AI Assistant
version: 0.11.0
slug: hass_ai_assistant
image: ghcr.io/ito-69/hass-pi-agent/{arch}-hass_ai_assistant
description: >-
  Local and Cloud AI Assistant with full Home Assistant access — manage
  automations, entities, dashboards, and more via natural language.
startup: services
ingress: true
ingress_port: 0
ingress_stream: true
init: false
panel_icon: mdi:brain
panel_title: AI Assistant
arch:
  - aarch64
  - amd64
homeassistant_api: true
hassio_api: true
hassio_role: admin
auth_api: true
map:
  - homeassistant_config:rw
  - all_addon_configs:rw
  - ssl:rw
  - share:rw
  - media:rw
  - backup:rw
options:
  default_provider: openai
  default_model: gpt-6.1-sol
  openai_api_base: ''
  ollama_host: ''
  install_integration: true
  fresh_session: false
  environment: []
  additional_packages: []
  custom_system_prompt: ''
schema:
  default_provider: >-
    list(anthropic|openai|google|openrouter|groq|xai|mistral|cerebras|huggingface|github-copilot|amazon-bedrock|google-vertex|azure-openai-responses|opencode|opencode-go|minimax|omniroute|llama-cpp|ollama)
  default_model: str?
  openai_api_base: str?
  ollama_host: str?
  install_integration: bool?
  fresh_session: bool?
  service_provider: >-
    list(anthropic|openai|google|openrouter|groq|xai|mistral|cerebras|huggingface|github-copilot|amazon-bedrock|google-vertex|azure-openai-responses|opencode|opencode-go|minimax|omniroute|llama-cpp|ollama)?
  service_model: str?
  environment:
    - str
  additional_packages:
    - str
  custom_system_prompt: str?
